<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כדורגל שכונתי</title>
<style>
:root{--bg:#0f1720;--card:#18232f;--line:#2a3a4a;--text:#eef3f8;--mute:#8fa3b5;--green:#2ecc71;--red:#ff5c5c;--amber:#f5b942;--blue:#4aa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
header{padding:18px 16px 8px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
main{max-width:560px;margin:0 auto;padding:8px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
h2{margin:0;font-size:18px}
h3{margin:14px 0 6px;font-size:15px;color:var(--mute)}
.count{font-weight:700;padding:3px 10px;border-radius:99px;background:#223344;font-size:14px}
.count.full{background:#4a2b2b;color:var(--red)}
input,select{font:inherit;color:var(--text);background:#0f1720;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input[type=text],input[type=date],input[type=password]{flex:1;width:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--green);color:#06210f;font-weight:700}
button.sec{background:#26384a;color:var(--text)}
button.danger{background:#4a2b2b;color:var(--red)}
button.small{padding:5px 10px;font-size:13px}
button:disabled{opacity:.5}
ol{margin:0;padding:0;list-style:none}
li.p{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
li.p:last-child{border-bottom:0}
li.p .n{width:26px;color:var(--mute);font-size:13px}
li.p .name{flex:1}
.lvl{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:#26384a}
.lvl.l1{background:#1d4d33;color:var(--green)}
.lvl.l2{background:#4a3f1d;color:var(--amber)}
.lvl.l3{background:#1d3b5c;color:var(--blue)}
.lvl.l0{background:#4a2b2b;color:var(--red)}
.wait li.p .n{color:var(--amber)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{border-radius:12px;padding:10px;border:1px solid var(--line)}
.team h4{margin:0 0 6px;font-size:15px}
.team div{font-size:14px;padding:2px 0}
.t0{background:#3a1f1f}.t1{background:#1c2f4a}.t2{background:#1d3a28}.t3{background:#44391a}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.msg.err{background:#4a2b2b;color:#ffb3b3}
.msg.ok{background:#1d4d33;color:#aef0c8}
.mute{color:var(--mute);font-size:14px}
.foot{text-align:center;margin-top:24px}
.foot a{color:var(--mute);font-size:13px;text-decoration:underline;cursor:pointer}
.adm{border-color:#5b4a1d}
</style>
</head>
<body>
<header>
  <h1>⚽ כדורגל שכונתי</h1>
  <p>נרשמים לכדורגל השבועי · 20 שחקנים</p>
</header>
<main id="app"><p class="mute" style="text-align:center">טוען...</p></main>

<script>
const API = 'https://rpcvvsphniyounrpllzk.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_FmYLILyPTNWamPI8ErgBdA_-7qbC0KP';
const MAX = 20;
const TEAM_NAMES = ['אדומה', 'כחולה', 'ירוקה', 'צהובה'];

let games = [];
let players = [];
let code = '';
try { code = localStorage.getItem('fb_admin') || ''; } catch (e) {}
let isAdmin = false;
let notice = null;

async function rpc(fn, args) {
  const r = await fetch(API + fn, {
    method: 'POST',
    headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const t = await r.text();
  let d; try { d = JSON.parse(t); } catch (e) { d = t; }
  if (!r.ok) throw new Error((d && d.message) || 'שגיאה');
  return d;
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') el.className = attrs[k];
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(c));
  }
  return el;
}

const norm = s => s.trim().replace(/\s+/g, ' ');
const key = s => norm(s).toLowerCase();

function levelOf(name) {
  const p = players.find(x => key(x.full_name) === key(name));
  return p ? p.level : null;
}

function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' });
}

function say(type, text) { notice = { type, text }; }

async function load() {
  try {
    games = await rpc('get_games');
    if (code) {
      try { players = await rpc('admin_get_players', { code }); isAdmin = true; }
      catch (e) { isAdmin = false; code = ''; players = []; try { localStorage.removeItem('fb_admin'); } catch (x) {} }
    }
  } catch (e) { say('err', 'לא הצלחתי לטעון: ' + e.message); }
  render();
}

async function act(fn, args, okText) {
  try {
    const res = await rpc(fn, args);
    return res;
  } catch (e) {
    say('err', e.message);
    render();
    return null;
  }
}

async function register(gameId, input) {
  const name = norm(input.value);
  if (!name) return;
  const res = await act('register_player', { p_game: gameId, p_name: name });
  if (res === 'need_full_name') say('err', 'צריך לכתוב שם ושם משפחה');
  else if (res === 'already') say('err', 'השם הזה כבר רשום למשחק');
  else if (res === 'ok') say('ok', 'נרשמת בהצלחה ✔');
  await load();
}

async function cancelReg(gameId, name) {
  if (!confirm('לבטל את ההרשמה של ' + name + '?')) return;
  const res = await act('cancel_registration', { p_game: gameId, p_name: name });
  if (res === 'ok') say('ok', 'ההרשמה בוטלה. הראשון ברשימת ההמתנה נכנס במקומו.');
  await load();
}

function adminLogin() {
  const c = prompt('קוד מנהל:');
  if (!c) return;
  code = c.trim();
  try { localStorage.setItem('fb_admin', code); } catch (e) {}
  load().then(() => { if (!isAdmin) { say('err', 'קוד שגוי'); render(); } });
}

function adminLogout() {
  code = ''; isAdmin = false; players = [];
  try { localStorage.removeItem('fb_admin'); } catch (e) {}
  render();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function splitTeams(names) {
  const list = names.map(n => ({ n, l: levelOf(n) || 2 }));
  shuffle(list);
  list.sort((a, b) => a.l - b.l);
  const teams = TEAM_NAMES.map(() => ({ players: [], sum: 0, cnt: { 1: 0, 2: 0, 3: 0 } }));
  for (const p of list) {
    const scored = teams.map(t => ({
      t,
      k: [t.players.length, t.cnt[p.l], p.l === 1 ? -t.sum : p.l === 3 ? t.sum : 0, Math.random()]
    }));
    scored.sort((a, b) => {
      for (let i = 0; i < 4; i++) if (a.k[i] !== b.k[i]) return a.k[i] - b.k[i];
      return 0;
    });
    const t = scored[0].t;
    t.players.push(p.n); t.sum += p.l; t.cnt[p.l]++;
  }
  return teams.map((t, i) => ({ name: TEAM_NAMES[i], players: t.players }));
}

async function doSplit(g) {
  const names = g.names.slice(0, MAX);
  if (names.length < 4) { say('err', 'אין מספיק שחקנים רשומים'); render(); return; }
  const noLevel = names.filter(n => !levelOf(n));
  if (noLevel.length && !confirm('יש ' + noLevel.length + ' שחקנים בלי רמה. הם יחושבו כרמה 2. להמשיך?')) return;
  if (g.teams && !confirm('כבר יש חלוקה. לחלק מחדש?')) return;
  const teams = splitTeams(names);
  const res = await act('admin_save_teams', { code, p_game: g.id, p_teams: teams });
  if (res === 'ok') say('ok', 'הקבוצות חולקו ✔');
  await load();
}

async function clearTeams(g) {
  if (!confirm('למחוק את החלוקה?')) return;
  await act('admin_save_teams', { code, p_game: g.id, p_teams: null });
  await load();
}

async function deleteGame(g) {
  if (!confirm('למחוק את המשחק ואת כל ההרשמות אליו?')) return;
  await act('admin_delete_game', { code, p_id: g.id });
  await load();
}

function personRow(i, name, gameId, waiting) {
  const lv = isAdmin ? levelOf(name) : null;
  return h('li', { class: 'p' },
    h('span', { class: 'n' }, i),
    h('span', { class: 'name' }, name),
    isAdmin ? h('span', { class: 'lvl l' + (lv || 0) }, lv ? 'רמה ' + lv : 'ללא רמה') : null,
    h('button', { class: 'sec small', onclick: () => cancelReg(gameId, name) }, 'ביטול')
  );
}

function gameCard(g) {
  const names = g.names || [];
  const inList = names.slice(0, MAX);
  const waiting = names.slice(MAX);
  const input = h('input', { type: 'text', placeholder: 'שם ושם משפחה', autocomplete: 'off' });
  const btn = h('button', { onclick: () => register(g.id, input) }, 'הירשם');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') register(g.id, input); });

  const card = h('div', { class: 'card' },
    h('div', { class: 'row between' },
      h('h2', {}, fmtDate(g.game_date)),
      h('span', { class: 'count' + (names.length >= MAX ? ' full' : '') }, Math.min(names.length, MAX) + '/' + MAX)
    )
  );

  if (g.teams && g.teams.length) {
    card.append(h('h3', {}, 'הקבוצות'));
    card.append(h('div', { class: 'teams' }, g.teams.map((t, i) =>
      h('div', { class: 'team t' + i }, h('h4', {}, 'קבוצה ' + t.name), t.players.map(n => h('div', {}, n)))
    )));
  }

  card.append(h('h3', {}, 'רשומים'));
  card.append(inList.length
    ? h('ol', {}, inList.map((n, i) => personRow(i + 1, n, g.id)))
    : h('p', { class: 'mute' }, 'עדיין אף אחד לא נרשם'));

  if (waiting.length) {
    card.append(h('h3', {}, 'רשימת המתנה'));
    card.append(h('ol', { class: 'wait' }, waiting.map((n, i) => personRow(i + 1, n, g.id, true))));
  }

  card.append(h('h3', {}, names.length >= MAX ? 'המשחק מלא, תיכנס לרשימת המתנה' : 'הרשמה'));
  card.append(h('div', { class: 'row' }, input, btn));

  if (isAdmin) {
    card.append(h('div', { class: 'row', style: 'margin-top:14px;flex-wrap:wrap' },
      h('button', { onclick: () => doSplit(g) }, 'חלק קבוצות'),
      g.teams ? h('button', { class: 'sec', onclick: () => clearTeams(g) }, 'נקה חלוקה') : null,
      h('button', { class: 'danger', onclick: () => deleteGame(g) }, 'מחק משחק')
    ));
  }
  return card;
}

function adminPanel() {
  const dateIn = h('input', { type: 'date' });
  const createBtn = h('button', { onclick: async () => {
    if (!dateIn.value) return;
    const r = await act('admin_create_game', { code, p_date: dateIn.value });
    if (r === 'ok') say('ok', 'המשחק נפתח ✔');
    await load();
  } }, 'פתח');

  const nameIn = h('input', { type: 'text', placeholder: 'שם ושם משפחה' });
  const lvlSel = h('select', {}, h('option', { value: '' }, 'ללא רמה'), h('option', { value: '1' }, 'רמה 1'), h('option', { value: '2' }, 'רמה 2'), h('option', { value: '3' }, 'רמה 3'));
  const addBtn = h('button', { onclick: async () => {
    const n = norm(nameIn.value);
    if (!n.includes(' ')) { say('err', 'צריך שם ושם משפחה'); render(); return; }
    const r = await act('admin_add_player', { code, p_name: n, p_level: lvlSel.value ? Number(lvlSel.value) : null });
    if (r === 'ok') say('ok', 'השחקן נשמר ✔');
    await load();
  } }, 'הוסף');

  const noLvl = players.filter(p => !p.level);
  const sorted = [...noLvl, ...players.filter(p => p.level)];

  const list = h('ol', {}, sorted.map(p => {
    const sel = h('select', {}, ['', '1', '2', '3'].map(v =>
      h('option', Object.assign({ value: v }, String(p.level || '') === v ? { selected: 'selected' } : {}), v ? 'רמה ' + v : 'ללא רמה')));
    sel.addEventListener('change', async () => {
      await act('admin_set_level', { code, p_id: p.id, p_level: sel.value ? Number(sel.value) : null });
      await load();
    });
    return h('li', { class: 'p' }, h('span', { class: 'name' }, p.full_name), sel);
  }));

  return h('div', { class: 'card adm' },
    h('div', { class: 'row between' }, h('h2', {}, '🔧 ניהול'), h('button', { class: 'sec small', onclick: adminLogout }, 'התנתק')),
    h('h3', {}, 'פתיחת משחק חדש'),
    h('div', { class: 'row' }, dateIn, createBtn),
    h('h3', {}, 'הוספת שחקן'),
    h('div', { class: 'row' }, nameIn, lvlSel, addBtn),
    h('h3', {}, 'שחקנים (' + players.length + ')' + (noLvl.length ? ' · ' + noLvl.length + ' ללא רמה' : '')),
    players.length ? list : h('p', { class: 'mute' }, 'עדיין אין שחקנים')
  );
}

function render() {
  const app = document.getElementById('app');
  const active = document.activeElement;
  app.replaceChildren();
  if (notice) { app.append(h('div', { class: 'msg ' + notice.type }, notice.text)); notice = null; }
  if (!games.length) app.append(h('div', { class: 'card' }, h('p', { class: 'mute', style: 'margin:0' }, 'אין משחק פתוח כרגע. חזור מאוחר יותר.')));
  games.forEach(g => app.append(gameCard(g)));
  if (isAdmin) app.append(adminPanel());
  app.append(h('div', { class: 'foot' },
    h('button', { class: 'sec small', onclick: () => load() }, 'רענן'),
    h('div', { style: 'margin-top:14px' }, isAdmin ? null : h('a', { onclick: adminLogin }, 'כניסת מנהל'))
  ));
}

load();
</script>
</body>
</html>
